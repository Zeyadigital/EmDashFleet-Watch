# Weekly version updates of every GitHub Action of the outside watch (app plan,
# Security (Template supply chain); CLAUDE.md Versions constraint; tracker
# APB-001, APC-005). Version-update pull requests target dev, where pushes go
# (HR-162); a security update always uses the default branch, main, whatever
# target-branch says. The newest stable release is proposed, a co-founder
# merges it. A release is proposed 7 days after it is published, not the week
# it lands (without a cooldown Dependabot applies a default of 3 days), so a
# release GitHub withdraws in its first days never reaches a pull request; a
# security update ignores the cooldown. GitHub Actions is the only ecosystem in use:
# package.json holds no dependency (test/hygiene.test.mjs fails when one
# appears, and then an npm entry is added here), and the check script is plain
# bash and curl.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
