# Weekly version updates of every GitHub Action of the outside watch (app plan,
# Security (Template supply chain); CLAUDE.md Versions constraint; tracker
# APB-001, APC-005). Pull requests target dev, where feature pull requests go;
# the newest stable release is proposed, the owner merges it. GitHub Actions is
# the only ecosystem in use: package.json holds no dependency (test/hygiene.test.mjs
# fails when one appears, and then an npm entry is added here), and the check
# script is plain bash and curl.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
